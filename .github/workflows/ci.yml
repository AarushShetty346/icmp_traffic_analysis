name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Lint lab scripts (shellcheck)
        run: shellcheck -x scripts/lab/*.sh
      - name: Unit tests
        run: python -m unittest -v
      - name: Golden fixtures are current
        run: |
          python -m icmp_detector golden --out /tmp/golden
          diff -r /tmp/golden tests/golden
      - name: Exporter runs and validates against the schema
        run: python -m icmp_detector export-ui --out /tmp/ui-data --runs 4 --bootstrap 50 --seeds 1 2

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Lint lab scripts (shellcheck)
        run: shellcheck -x scripts/lab/*.sh
      - name: Unit tests
        run: python -m unittest -v
      - name: Golden fixtures are current
        run: |
          python -m icmp_detector golden --out /tmp/golden
          diff -r /tmp/golden tests/golden
      - name: Exporter runs and validates against the schema
        run: python -m icmp_detector export-ui --out /tmp/ui-data --runs 4 --bootstrap 50 --seeds 1 2

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit and parity tests (golden fixtures, 1e-9)
        run: npm test
      - name: Build
        run: npm run build
      - name: Initial JS budget (300 KB gzipped)
        run: npm run size
      - name: Storybook builds
        run: npm run build-storybook -- --quiet
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: End-to-end (controls manifest, axe, overflow, keyboard)
        run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: ui/test-results

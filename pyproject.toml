[project]
name = "icmp-detector"
version = "2.0.0"
description = "Detection of ICMP-based covert timing channels from inter-packet delays (BCSE308P lab project)"
requires-python = ">=3.10"
license = {file = "LICENSE"}

[tool.setuptools]
packages = ["icmp_detector"]

[tool.setuptools.package-data]
icmp_detector = ["schema/*.json"]

[tool.ruff]
line-length = 140
target-version = "py310"
extend-exclude = ["ui"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008", "B023", "B905"]
